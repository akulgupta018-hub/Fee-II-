<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        .input-section {
            display: flex;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            padding: 5px;
            background: #fff;
        }

        .input-section input {
            flex: 1;
            padding: 8px;
            border: none;
            font-size: 1rem;
            outline: none;
        }

        .input-section button {
            padding: 8px 15px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            cursor: pointer;
        }

        .task-card {
            border: 2px solid #a05252;
            padding: 10px;
            margin-bottom: 15px;
            background: #fff;
        }

        .task-top {
            display: flex;
            margin-bottom: 10px;
        }

        .task-top input {
            flex: 1;
            padding: 5px;
            border: 1px solid #ccc;
        }

        .task-top button {
            padding: 5px 10px;
            margin-left: 5px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            cursor: pointer;
        }

        .task-content {
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .task-actions button {
            padding: 5px 10px;
            margin-right: 5px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Add Task Section -->
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Enter task...">
            <button id="addBtn">Add</button>
        </div>

        <!-- Task List Container -->
        <div id="taskList"></div>
    </div>

    <script>
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');

        addBtn.addEventListener('click', () => {
            const taskText = taskInput.value.trim();
            if (taskText === '') return;

            createTaskElement(taskText);
            taskInput.value = '';
        });

        function createTaskElement(text) {
            const card = document.createElement('div');
            card.classList.add('task-card');

            card.innerHTML = `
                <div class="task-top">
                    <input type="text" value="${text}">
                    <button class="save-btn">Save</button>
                </div>
                <div class="task-content">${text}</div>
                <div class="task-actions">
                    <button class="delete-btn">Delete</button>
                    <button class="edit-btn">Edit</button>
                </div>
            `;

            const topInput = card.querySelector('.task-top input');
            const contentDiv = card.querySelector('.task-content');
            const saveBtn = card.querySelector('.save-btn');
            const deleteBtn = card.querySelector('.delete-btn');
            const editBtn = card.querySelector('.edit-btn');

            // Save button functionality
            saveBtn.addEventListener('click', () => {
                contentDiv.textContent = topInput.value;
            });

            // Edit button functionality (focuses top input)
            editBtn.addEventListener('click', () => {
                topInput.focus();
            });

            // Delete button functionality
            deleteBtn.addEventListener('click', () => {
                card.remove();
            });

            taskList.appendChild(card);
        }
    </script>
</body>
</html>
